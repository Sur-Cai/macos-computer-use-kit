[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "macos-computer-use-kit"
version = "0.3.1"
description = "AX-first macOS computer use for AI agents: an MCP server + CLI for Claude Code, Codex, Cursor and any MCP client. Accessibility-tree targeting with stable refs, background input that never moves your cursor, Unicode typing, menus/windows/apps, set-of-mark screenshots, on-device OCR, verified actions, and a deterministic safety policy."
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
keywords = [
  "computer-use",
  "mcp",
  "mcp-server",
  "model-context-protocol",
  "claude-code",
  "claude",
  "codex",
  "cursor",
  "desktop-automation",
  "gui-agent",
  "ocr",
  "set-of-mark",
  "macos",
  "accessibility",
  "automation",
  "ai-agent",
  "agent-tools",
  "opencode",
  "pi-package",
  "dsh-plugin",
  "jev",
  "typesafe-ai",
  "system-one",
  "llm-guardrails",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: MacOS X :: Cocoa",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: User Interfaces",
]
dependencies = [
  "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
  "pyobjc-framework-ApplicationServices>=10.0; sys_platform == 'darwin'",
  "pillow>=10.0",
]

[project.optional-dependencies]
# OCR works without this (the system Vision.framework is loaded directly);
# installing the wrapper just gives the typed pyobjc bindings.
ocr = ["pyobjc-framework-Vision>=10.0; sys_platform == 'darwin'"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/Sur-Cai/macos-computer-use-kit"
Repository = "https://github.com/Sur-Cai/macos-computer-use-kit"
Issues = "https://github.com/Sur-Cai/macos-computer-use-kit/issues"
Changelog = "https://github.com/Sur-Cai/macos-computer-use-kit/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Sur-Cai/macos-computer-use-kit#readme"

[project.scripts]
macos-cu = "macos_computer_use.cli:main"
# Lets `uvx macos-computer-use-kit mcp` work without --from.
macos-computer-use-kit = "macos_computer_use.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/macos_computer_use"]

# Ship the agent skill inside the wheel so `macos-cu setup skill` works from PyPI.
[tool.hatch.build.targets.wheel.force-include]
"skill" = "macos_computer_use/_skill"

[tool.hatch.build.targets.sdist]
include = ["/src", "/skill", "/tests", "/README.md", "/README.zh-CN.md", "/CHANGELOG.md", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
